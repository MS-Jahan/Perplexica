services:
  vane:
    image: itzcrazykns1337/vane:latest
    build:
      context: .
    # No host port mapping: Coolify's traefik proxy routes to the container
    # port directly. Publishing `3010:3000` made Coolify set the traefik
    # loadbalancer port to 3010 (host side), which nothing listens on inside
    # the container — 502s. Container port 3000 comes from the Dockerfile.
    environment:
      # Point Vane at an external SearXNG instance instead of the bundled one.
      # Leave SEARXNG_API_URL unset to use the bundled SearXNG (:8080).
      - SEARXNG_API_URL=${SEARXNG_API_URL:-}
      # Auth for the external instance — either a fully custom header:
      - SEARXNG_AUTH_HEADER=${SEARXNG_AUTH_HEADER:-}
      - SEARXNG_AUTH_VALUE=${SEARXNG_AUTH_VALUE:-}
      # ...or a key sent as `Authorization: Bearer <key>` (+ X-SearXNG-API-Key),
      # or `basic` (SEARXNG_API_KEY_TYPE=basic, key = user:password).
      - SEARXNG_API_KEY=${SEARXNG_API_KEY:-}
      - SEARXNG_API_KEY_TYPE=${SEARXNG_API_KEY_TYPE:-}
    volumes:
      - data:/home/vane/data
    restart: unless-stopped

volumes:
  data:
    name: 'vane-data'
